<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para mi futura esposa 💗</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        /* Noche estrellada */
        .stars {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px #ffffff;
            animation: twinkle var(--duration) infinite ease-in-out;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Contenedor principal */
        .container {
            position: relative;
            z-index: 2;
            padding: 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            width: 500px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 25px;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5);
        }

        .btn-container {
            position: relative;
            min-height: 120px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        button {
            padding: 14px 32px;
            font-size: 1.2rem;
            font-weight: bold;
            color: #ffffff;
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 75, 43, 0.4);
            transition: transform 0.2s ease, background 0.3s ease;
        }

        button:hover {
            transform: scale(1.05);
        }

        /* Pantalla final */
        .hidden {
            display: none;
        }

        .video-wrapper {
            margin-top: 20px;
            position: relative;
            padding-bottom: 56.25%; /* Relación 16:9 */
            height: 0;
            overflow: hidden;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 0;
        }

        .drive-btn {
            display: inline-block;
            margin-top: 15px;
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.2);
            color: #fff;
            text-decoration: none;
            border-radius: 20px;
            font-size: 0.9rem;
            transition: background 0.3s;
        }

        .drive-btn:hover {
            background: rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="stars" id="stars"></div>

    <!-- PANTALLA INICIAL -->
    <div class="container" id="proposal-box">
        <h1 id="question">¿Quieres ser mi futura esposa? 💍</h1>
        <div class="btn-container">
            <button id="yes-btn">¡Sí! 💗</button>
        </div>
    </div>

    <!-- PANTALLA FINAL -->
    <div class="container hidden" id="final-box">
        <h1>Esto es para ti 💗</h1>
        <div class="video-wrapper">
            <!-- Reproductor integrado de Google Drive -->
            <iframe id="drive-iframe" src="" allow="autoplay"></iframe>
        </div>
        <a id="drive-link" href="#" target="_blank" class="drive-btn">Ver en Google Drive ↗</a>
    </div>

    <script>
        // --- 1. CONFIGURACIÓN DEL VIDEO DE DRIVE ---
        const DRIVE_FILE_ID = "1BnnPWdOQWyvEgY4WHSG4ar2JZunzlLzE";

        // --- 2. GENERADOR DE ESTRELLAS ---
        const starsContainer = document.getElementById('stars');
        const starCount = 100;

        for (let i = 0; i < starCount; i++) {
            const star = document.createElement('div');
            star.classList.add('star');
            star.style.width = `${Math.random() * 3 + 1}px`;
            star.style.height = star.style.width;
            star.style.left = `${Math.random() * 100}%`;
            star.style.top = `${Math.random() * 100}%`;
            star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
            starsContainer.appendChild(star);
        }

        // --- 3. LÓGICA DEL BOTÓN ZANGOLOTEADO / TRAVIESO ---
        const yesBtn = document.getElementById('yes-btn');
        const proposalBox = document.getElementById('proposal-box');
        const finalBox = document.getElementById('final-box');
        const driveIframe = document.getElementById('drive-iframe');
        const driveLink = document.getElementById('drive-link');

        let clickCount = 0;
        const maxClicks = 10;

        yesBtn.addEventListener('click', () => {
            clickCount++;

            if (clickCount < maxClicks) {
                // Mueve el botón a una posición aleatoria dentro del contenedor
                yesBtn.style.position = 'absolute';
                const containerRect = proposalBox.getBoundingClientRect();
                const btnRect = yesBtn.getBoundingClientRect();

                const maxX = (containerRect.width / 2) - (btnRect.width / 2) - 20;
                const maxY = (containerRect.height / 2) - (btnRect.height / 2) - 20;

                const randomX = (Math.random() * maxX * 2) - maxX;
                const randomY = (Math.random() * maxY * 2) - maxY;

                yesBtn.style.transform = `translate(${randomX}px, ${randomY}px)`;
            } else {
                // Al llegar al clic número 10, muestra la pantalla final
                proposalBox.classList.add('hidden');
                
                // Configura los enlaces del video de Drive
                driveIframe.src = `https://drive.google.com/file/d/${DRIVE_FILE_ID}/preview`;
                driveLink.href = `https://drive.google.com/file/d/${DRIVE_FILE_ID}/view?usp=sharing`;
                
                finalBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
